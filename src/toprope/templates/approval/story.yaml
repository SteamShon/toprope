title: An agent asks for access; people decide
keywords: [request, approve, approval, reject, submit, manager, access, permission, grant, sign]   # toprope-init "<a sentence>" picks the template whose words it uses most
about: >
  An agent files access requests for the team. A manager approves them, prod access needs
  security, and nobody approves a request they (or their agent) made.
next: >
  Try `toprope-set prod_approver=manager` to let managers approve prod access, and see what the change touches; set it back with `toprope-set prod_approver=security`.
settings:
  prod_approver:
    says: The role that approves access to prod.
    type: role
    default: security
    at: actions.approve_request.preconditions.prod-needs-security
    check: "target.system != 'prod' or '{value}' in actor.roles"
    reason: "Access to prod is approved by {value}."
steps:
  - {who: t-bot, as: the agent, action: submit_request, target: R-prod, says: "request prod access for dana", expect: ok}
  - {who: t-bot, as: the agent, action: approve_request, target: R-prod, says: "approve it", expect: denied, code: actor}
  - {who: t-max, as: max (manager), action: approve_request, target: R-prod, says: "approve it", expect: denied, code: prod-needs-security}
  - {who: t-sec, as: sec (security), action: approve_request, target: R-prod, says: "approve it", expect: ok}
  - {who: t-max, as: max (manager), action: submit_request, target: R-wiki, says: "request wiki access for dana", expect: ok}
  - {who: t-max, as: max (manager), action: approve_request, target: R-wiki, says: "approve his own request", expect: denied, code: not-the-requester}
