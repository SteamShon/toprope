domain: delivery
version: 1
purpose:
  problem: An approved domain version must become working software in an environment,
    and nothing unverified may reach it.
  success_metric:
    name: share of approved versions that reach verified-in-use without a manual fix
      or rollback
    direction: up
  announcement: Approved domain versions now reach the environment as working software
    in one step. Nothing that fails its checks or lacks a person's approval gets there.
roles:
- approver
objects:
  DeliveryRequest:
    description: A request to deliver an approved commit of a domain, handed off by
      Authoring.
    properties:
      domain_id:
        type: string
      commit:
        type: string
      interface:
        type: string
      environment:
        type: string
      approver:
        type: string
      build:
        type: string
        optional: true
      harness_ok:
        type: boolean
        optional: true
      deployed:
        type: boolean
        optional: true
      refusal:
        type: string
        optional: true
      verified:
        type: boolean
        optional: true
      stage:
        enum:
        - requested
        - previewing
        - previewed
        - deploying
        - done
        - verified
    source:
      kind: interview
      ref: interview:interview/delivery/log.jsonl#L4
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  Environment:
    description: Where a domain runs; it points at one deployed commit.
    properties:
      name:
        type: string
      current_commit:
        type: string
        optional: true
    source:
      kind: interview
      ref: interview:interview/delivery/log.jsonl#L4
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
links: {}
actions:
  request_delivery:
    description: Receive a request to deliver an approved commit, handed off by Authoring.
    actor:
    - system
    creates: DeliveryRequest
    params:
      domain_id:
        type: string
      commit:
        type: string
      interface:
        type: string
      environment:
        type: string
      approver:
        type: string
    source:
      kind: interview
      ref: interview:interview/delivery/log.jsonl#L4
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  preview:
    description: Build the commit and run its harness, before anything is deployed.
    actor:
    - approver
    target: DeliveryRequest
    effects:
    - call: preview
      with:
        domain: target.domain_id
        commit: target.commit
      reply: record_build
    source:
      kind: interview
      ref: interview:interview/delivery/log.jsonl#L4
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  record_build:
    description: Record the build and its harness result.
    actor:
    - external:kernel
    target: DeliveryRequest
    params:
      build:
        type: string
      harness_ok:
        type: boolean
    effects:
    - set:
        target.build: params.build
        target.harness_ok: params.harness_ok
    source:
      kind: interview
      ref: interview:interview/delivery/log.jsonl#L4
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  deploy:
    description: Deploy the commit, under the fixed floor. Only a person deploys.
    actor:
    - approver
    target: DeliveryRequest
    requires: human
    records_decision: true
    effects:
    - call: deploy
      with:
        domain: target.domain_id
        commit: target.commit
        approver: actor.id
      reply: record_deployment
    source:
      kind: interview
      ref: interview:interview/delivery/log.jsonl#L4
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
    preconditions:
    - id: harness-passed
      check: target.harness_ok == true
      reason: Deploy only a build whose harness passed.
  record_deployment:
    description: Record whether the deploy happened, or which floor rule refused it.
    actor:
    - external:kernel
    target: DeliveryRequest
    params:
      deployed:
        type: boolean
      error:
        type: string
    effects:
    - set:
        target.deployed: params.deployed
        target.refusal: params.error
    source:
      kind: interview
      ref: interview:interview/delivery/log.jsonl#L4
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  verify:
    description: Confirm the deployed domain works in use (the probes).
    actor:
    - approver
    target: DeliveryRequest
    requires: human
    params:
      verified:
        type: boolean
    effects:
    - set:
        target.verified: params.verified
    source:
      kind: interview
      ref: interview:interview/delivery/log.jsonl#L4
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
    preconditions:
    - id: deployed
      check: target.deployed == true
      reason: Only a deployment that happened can be verified.
transitions:
  DeliveryRequest:
    field: stage
    initial: requested
    matrix:
      requested:
        preview: previewing
        record_build: n/a
        deploy:
          deny: Preview it first.
        record_deployment: n/a
        verify: n/a
      previewing:
        preview:
          deny: A preview is running.
        record_build: previewed
        deploy:
          deny: The preview has not finished.
        record_deployment: n/a
        verify: n/a
      previewed:
        preview: previewing
        record_build: n/a
        deploy: deploying
        record_deployment: n/a
        verify: n/a
      deploying:
        preview:
          deny: A deploy is running.
        record_build: n/a
        deploy:
          deny: A deploy is running.
        record_deployment: done
        verify: n/a
      done:
        preview: previewing
        record_build: n/a
        deploy: deploying
        record_deployment: n/a
        verify: verified
      verified:
        preview: n/a
        record_build: n/a
        deploy: n/a
        record_deployment: n/a
        verify:
          deny: Already verified.
