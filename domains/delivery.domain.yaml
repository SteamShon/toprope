domain: delivery
version: 1
purpose:
  problem: An approved domain version must become working software in an environment,
    and nothing unverified may reach it.
  success_metric:
    name: share of approved versions that reach verified-in-use without a manual fix
      or rollback
    direction: up
  announcement: Approved domain versions now reach the environment as working software
    in one step. Nothing that fails its checks or lacks a person's approval gets there.
roles:
- approver
objects:
  DeliveryRequest:
    description: A request to deliver an approved commit of a domain, handed off by
      Authoring.
    properties:
      domain_id:
        type: string
      commit:
        type: string
      interface:
        type: string
      environment:
        type: string
      approver:
        type: string
    source:
      kind: record
      ref: records:docs/experiments/M1-self-domains-scope.md#L33-L56
    status: proposed
  Build:
    description: The artifacts built from one commit, with its harness result (a preview).
    properties:
      commit:
        type: string
      harness_ok:
        type: boolean
      toolchain:
        type: string
    source:
      kind: system
      ref: system:src/toprope/deploy/__init__.py#L1-L120
    status: proposed
  Environment:
    description: Where a domain runs; it points at one deployed commit.
    properties:
      name:
        type: string
      current_commit:
        type: string
        optional: true
    source:
      kind: system
      ref: system:src/toprope/deploy/__init__.py#L1-L120
    status: proposed
  Deployment:
    description: One attempt to move an environment to a commit, under the fixed floor.
    properties:
      commit:
        type: string
      approver:
        type: string
      refusal:
        type: string
        optional: true
    source:
      kind: system
      ref: system:src/toprope/deploy/__init__.py#L121-L240
    status: proposed
  Verification:
    description: Post-deploy checks of a deployment (the harness and the probes).
    properties:
      probes_pass:
        type: boolean
        optional: true
    source:
      kind: record
      ref: records:docs/experiments/M1-self-domains-scope.md#L33-L56
    status: proposed
links:
  request:
    from: Build
    to: DeliveryRequest
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview:interview/delivery/log.jsonl#L3
      quote: 7번, 8번 둘 다 추천대로 해도 될 것 같아.
    status: proposed
  build:
    from: Deployment
    to: Build
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview:interview/delivery/log.jsonl#L3
      quote: 7번, 8번 둘 다 추천대로 해도 될 것 같아.
    status: proposed
  environment:
    from: Deployment
    to: Environment
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview:interview/delivery/log.jsonl#L3
      quote: 7번, 8번 둘 다 추천대로 해도 될 것 같아.
    status: proposed
  deployment:
    from: Verification
    to: Deployment
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview:interview/delivery/log.jsonl#L3
      quote: 7번, 8번 둘 다 추천대로 해도 될 것 같아.
    status: proposed
