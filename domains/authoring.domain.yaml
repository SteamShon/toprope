domain: authoring
version: 1
purpose:
  problem: A domain owner's workflow lives in people's heads; turning it into a declared
    domain, and changing it safely, takes code.
  success_metric:
    name: human minutes from an owner's intent to a confirmed, compiled domain version
    direction: down
  announcement: Domain owners now turn the workflow in their heads into a declared,
    checked domain without writing code. Every change shows what it breaks before
    anything is deployed.
roles:
- owner
- expert
objects:
  Source:
    description: 'Where raw material lives: code, records, transcripts or the interview
      log.'
    properties:
      kind:
        enum:
        - repository
        - records
        - transcripts
        - interview-log
      path:
        type: string
      local_only:
        type: boolean
      sha256:
        type: string
        optional: true
      stage:
        enum:
        - added
        - fetched
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  Question:
    description: A question in a stage's bundle, for the owner to answer.
    properties:
      stage:
        type: string
      text:
        type: string
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  Answer:
    description: The owner's answer, in their words; its decisions become proposed
      elements.
    properties:
      words:
        type: string
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  Element:
    description: One part of the draft declaration (an object, action, cell, invariant...),
      proposed by an agent or confirmed by a person.
    properties:
      path:
        type: string
      review:
        enum:
        - proposed
        - confirmed
        - unknown
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  DecisionRequest:
    description: A decision only a person may take, proposed with grounds and a recommendation
      and sent to that person's outbox.
    properties:
      subject:
        type: string
      grounds:
        type: string
      recommendation:
        type: string
      stage:
        enum:
        - open
        - decided
      choice:
        type: string
        optional: true
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  Commit:
    description: An immutable snapshot of the working copy on a branch.
    properties:
      seq:
        type: integer
      content:
        type: string
      branch:
        type: string
      author:
        type: string
        optional: true
      message:
        type: string
        optional: true
      interface:
        type: string
      domain_id:
        type: string
      checks_passed:
        type: boolean
        optional: true
      failing:
        type: string
        optional: true
      approved:
        type: boolean
        optional: true
      main:
        type: string
        optional: true
      stage:
        enum:
        - recorded
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  Draft:
    description: 'The working copy of a domain''s declaration on a branch: what a
      commit snapshots.'
    properties:
      domain_id:
        type: string
      declaration:
        type: string
      branch:
        type: string
      stage:
        enum:
        - open
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
links:
  question:
    from: Answer
    to: Question
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  element:
    from: DecisionRequest
    to: Element
    cardinality: many-to-one
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  parents:
    from: Commit
    to: Commit
    cardinality: many-to-many
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  origin:
    from: Element
    to: Source
    cardinality: many-to-one
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
actions:
  add_source:
    description: 'Add a source of raw material: code, records, transcripts or the
      interview log.'
    actor:
    - owner
    creates: Source
    params:
      kind:
        enum:
        - repository
        - records
        - transcripts
        - interview-log
      path:
        type: string
      local_only:
        type: boolean
        optional: true
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  fetch_source:
    description: Fetch a link source into a snapshot, once.
    actor:
    - owner
    target: Source
    effects:
    - call: fetch_source
      with:
        source: target.id
      reply: record_fetch
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  record_fetch:
    description: Record the fetched snapshot's hash.
    actor:
    - external:kernel
    target: Source
    params:
      sha256:
        type: string
    effects:
    - set:
        target.sha256: params.sha256
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  ask_question:
    description: Ask a question of the current stage's bundle.
    actor:
    - owner
    creates: Question
    params:
      stage:
        type: string
      text:
        type: string
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  answer_question:
    description: Answer a question, in the person's own words.
    actor:
    - owner
    - expert
    creates: Answer
    params:
      question:
        ref: Question
      words:
        type: string
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  propose_element:
    description: Propose a draft element that cites where it came from.
    actor:
    - owner
    creates: Element
    params:
      path:
        type: string
      origin:
        ref: Source
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  confirm_element:
    description: Confirm a drafted element. Only a person confirms.
    actor:
    - owner
    target: Element
    requires: human
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  mark_unknown:
    description: Mark an element as not known yet, instead of guessing.
    actor:
    - owner
    - expert
    target: Element
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  request_decision:
    description: Ask the owner for a decision only a person may take, with grounds
      and a recommendation.
    actor:
    - owner
    creates: DecisionRequest
    params:
      element:
        ref: Element
      subject:
        type: string
      grounds:
        type: string
      recommendation:
        type: string
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  decide:
    description: Decide a requested decision.
    actor:
    - owner
    target: DecisionRequest
    params:
      choice:
        type: string
    requires: human
    records_decision: true
    effects:
    - set:
        target.choice: params.choice
    source:
      kind: record
      ref: records:docs/adr/0032-domain-knowledge-as-git-and-github.md#L38-L63
    status: proposed
  commit_draft:
    description: Snapshot the working copy as an immutable commit.
    actor:
    - owner
    target: Draft
    effects:
    - call: commit
      with:
        declaration: target.declaration
      reply: record_commit
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  record_commit:
    description: Record the commit the kernel made.
    actor:
    - external:kernel
    creates: Commit
    params:
      seq:
        type: integer
      content:
        type: string
      interface:
        type: string
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  check_commit:
    description: Run the change check on a commit.
    actor:
    - owner
    target: Commit
    effects:
    - call: change_check
      with:
        domain: target.domain_id
        commit: target.id
      reply: record_check
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  record_check:
    description: Record the change check's result on the commit.
    actor:
    - external:kernel
    target: Commit
    params:
      passed:
        type: boolean
      summary:
        type: string
    effects:
    - set:
        target.checks_passed: params.passed
        target.failing: params.summary
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  approve_commit:
    description: 'Approve a commit: merge it into main and tag it. Only a person approves.'
    actor:
    - owner
    target: Commit
    requires: human
    records_decision: true
    effects:
    - call: approve_commit
      with:
        domain: target.domain_id
        commit: target.id
        approver: actor.id
      reply: record_approval
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
    preconditions:
    - id: checks-pass
      check: target.checks_passed == true
      reason: Run the change check, and approve only a commit that passes it.
    - id: not-approved
      check: target.approved != true
      reason: Already approved; approve a newer commit.
  record_approval:
    description: Record the approval and what main points to.
    actor:
    - external:kernel
    target: Commit
    params:
      approved:
        type: boolean
      main:
        type: string
    effects:
    - set:
        target.approved: params.approved
        target.main: params.main
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L5
      quote: 9번은 추천대로 하면 될 것 같고 10번도 추천대로 하면 될 것 같아. 일단 A로 가되 나중에 추가할 수 있는 거지?
    status: proposed
  deliver:
    description: Ask Delivery to deliver an approved commit to an environment.
    actor:
    - owner
    target: Commit
    params:
      environment:
        enum:
        - local
    preconditions:
    - id: approved
      check: target.approved == true
      reason: Only an approved commit is delivered.
    source:
      kind: interview
      ref: interview:interview/authoring/log.jsonl#L8
      quote: 20번, 21번 둘 다 추천대로 동의.
    status: proposed
transitions:
  Source:
    field: stage
    initial: added
    matrix:
      added:
        fetch_source: added
        record_fetch: fetched
      fetched:
        fetch_source:
          deny: A link is fetched once into a snapshot; add a new source to read it
            again.
        record_fetch: n/a
  Element:
    field: review
    initial: proposed
    matrix:
      proposed:
        confirm_element: confirmed
        mark_unknown: unknown
      unknown:
        confirm_element: confirmed
        mark_unknown: n/a
      confirmed:
        confirm_element: n/a
        mark_unknown:
          deny: A confirmed element changes by a new proposal and a new commit, not
            by marking it unknown.
  DecisionRequest:
    field: stage
    initial: open
    matrix:
      open:
        decide: decided
      decided:
        decide:
          deny: Already decided; a new decision needs a new request.
  Draft:
    field: stage
    initial: open
    matrix:
      open:
        commit_draft: open
  Commit:
    field: stage
    initial: recorded
    matrix:
      recorded:
        check_commit: recorded
        record_check: recorded
        approve_commit: recorded
        record_approval: recorded
        deliver: recorded
invariants:
- id: approved-commits-passed-their-checks
  'on': Commit
  check: target.approved != true or target.checks_passed == true
  reason: An approved commit passed its change check.
- id: decided-requests-record-the-choice
  'on': DecisionRequest
  check: target.stage != 'decided' or exists(target.choice)
  reason: A decided request records what was chosen.
- id: fetched-sources-have-a-snapshot
  'on': Source
  check: target.stage != 'fetched' or exists(target.sha256)
  reason: A fetched source has the hash of its snapshot.
- id: elements-cite-a-source
  'on': Element
  check: exists(target.origin)
  reason: Every element cites where it came from.
world:
  actors:
    owner:
    - ana
    expert:
    - eli
  fixtures:
  - Source:
      id: S-code
      kind: repository
      path: src/toprope
      stage: added
  - Source:
      id: S-docs
      kind: records
      path: docs
      stage: fetched
      sha256: 5f1c
  - Question:
      id: Q1
      stage: purpose
      text: What problem does this domain solve, and for whom?
  - Answer:
      id: A1
      question: Q1
      words: Owners turn workflows into domains without code.
  - Element:
      id: E1
      path: purpose
      origin: S-docs
      review: proposed
  - Element:
      id: E2
      path: objects.Commit
      origin: S-code
      review: confirmed
  - Element:
      id: E3
      path: actions.mark_unknown
      origin: S-docs
      review: unknown
  - DecisionRequest:
      id: DR1
      element: E1
      subject: Which success metric?
      grounds: The scope document names two.
      recommendation: Human minutes to a confirmed version.
      stage: open
  - Draft:
      id: D1
      domain_id: authoring
      declaration: domains/authoring.domain.yaml
      branch: work
      stage: open
  - Commit:
      id: C1
      seq: 1
      content: a1b2
      branch: work
      interface: 1.0.0
      domain_id: authoring
      stage: recorded
      checks_passed: true
      approved: true
      main: C1
  - Commit:
      id: C2
      seq: 2
      content: c3d4
      branch: work
      interface: 1.1.0
      domain_id: authoring
      stage: recorded
      checks_passed: false
scenarios:
- id: approve-only-after-a-passing-check
  given:
    from_world: C2
  steps:
  - actor:
      role: owner
    do: approve_commit
    target: C2
    expect:
      denied_by: checks-pass
  - actor:
      external: kernel
    do: record_check
    target: C2
    params:
      passed: true
      summary: passes
    expect:
      state:
        C2.checks_passed: true
  - actor:
      role: owner
    do: approve_commit
    target: C2
    expect:
      state:
        C2.stage: recorded
  - actor:
      external: kernel
    do: record_approval
    target: C2
    params:
      approved: true
      main: C2
    expect:
      state:
        C2.approved: true
  - actor:
      role: owner
    do: approve_commit
    target: C2
    expect:
      denied_by: not-approved
- id: a-confirmed-element-is-not-unknown-again
  given:
    from_world: E1
  steps:
  - actor:
      role: owner
    do: confirm_element
    target: E1
    expect:
      state:
        E1.review: confirmed
  - actor:
      role: expert
    do: mark_unknown
    target: E1
    expect:
      denied_by: matrix
      reason_shown: true
- id: a-decision-is-taken-once
  given:
    from_world: DR1
  steps:
  - actor:
      role: owner
    do: decide
    target: DR1
    params:
      choice: A
    expect:
      state:
        DR1.stage: decided
        DR1.choice: A
  - actor:
      role: owner
    do: decide
    target: DR1
    params:
      choice: B
    expect:
      denied_by: matrix
- id: a-link-is-fetched-once
  given:
    from_world: S-docs
  steps:
  - actor:
      role: owner
    do: fetch_source
    target: S-docs
    expect:
      denied_by: matrix
handoffs:
  deliver_approved_commit:
    when:
      action: deliver
      outcome: ok
    to:
      domain: delivery
      interface: 1.x
      action: request_delivery
    params:
      domain_id: target.domain_id
      commit: target.id
      interface: target.interface
      environment: params.environment
      approver: actor.id
    target: target.domain_id + ':' + target.id + ':' + params.environment
