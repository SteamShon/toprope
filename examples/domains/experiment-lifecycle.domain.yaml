# Experiment lifecycle, v0 draft. Synthetic org rules, written to make implicit process explicit.
domain: experiment-lifecycle
version: 1
owner: SteamShon

glossary:
  hypothesis: "A falsifiable statement that a product change will move a metric, with the expected direction."
  primary_metric: "The single metric the ship decision is based on. Fixed at approval."
  guardrail_metric: "A metric that must not regress; a regression blocks shipping without escalation."
  readout: "The first analysis of an experiment's metrics after its planned duration."
  escalation: "A decision handed to the approver because rules alone cannot decide it."

roles: [pm, analyst, approver, eng]

objects:
  Hypothesis:
    description: Expected effect of a product change on a metric.
    properties:
      statement: {type: string}
      expected_direction: {enum: [up, down]}
  Metric:
    description: A measurable quantity with a fixed definition.
    properties:
      name: {type: string}
      definition: {type: string}
  Experiment:
    description: A controlled test of one hypothesis.
    properties:
      status: {enum: [draft, approved, running, ended, decided]}
      planned_days: {type: integer, min: 7}
      started_at: {type: datetime, optional: true}
      approved_by: {type: string, optional: true}
    states: {field: status}
  Readout:
    description: Metric results of an experiment after its planned duration.
    properties:
      primary_delta: {type: number}
      primary_significant: {type: boolean}
      guardrail_regressed: {type: boolean}
  Decision:
    description: A recorded ship / iterate / kill / escalate decision with inputs and rationale.
    properties:
      outcome: {enum: [ship, iterate, kill, escalate]}
      rationale: {type: string}
      decided_by: {type: string}

links:
  tests:          {from: Experiment, to: Hypothesis, cardinality: many-to-one, required: true}
  primary_metric: {from: Experiment, to: Metric, cardinality: many-to-one, required: true}
  guardrails:     {from: Experiment, to: Metric, cardinality: many-to-many}
  readout_of:     {from: Readout, to: Experiment, cardinality: one-to-one}
  decides:        {from: Decision, to: Experiment, cardinality: many-to-one}
  based_on:       {from: Decision, to: Readout, cardinality: many-to-one}

actions:
  design_experiment:
    description: Draft an experiment for a hypothesis.
    actor: [pm, analyst]
    creates: Experiment
    params:
      hypothesis: {ref: Hypothesis}
      primary_metric: {ref: Metric}
      guardrails: {ref: Metric, many: true}
      planned_days: {type: integer}
    preconditions:
      - id: min-duration
        check: params.planned_days >= 7
        reason: Experiments run at least 7 days to cover weekly seasonality.
      - id: has-guardrails
        check: count(params.guardrails) >= 1
        reason: Every experiment needs at least one guardrail metric.
    effects:
      - set: {new.status: draft}

  approve_experiment:
    description: Approve a drafted experiment for launch.
    actor: [approver]
    target: Experiment
    preconditions:
      - id: is-draft
        check: target.status == 'draft'
        reason: Only drafted experiments can be approved.
    effects:
      - set: {target.status: approved, target.approved_by: actor.id}
    records_decision: true

  launch_experiment:
    description: Start traffic to an approved experiment.
    actor: [eng]
    target: Experiment
    preconditions:
      - id: is-approved
        check: target.status == 'approved'
        reason: Launch requires approval by the approver role.
    effects:
      - set: {target.status: running, target.started_at: now}

  read_out:
    description: Produce the readout once the planned duration has passed.
    actor: [analyst]
    target: Experiment
    preconditions:
      - id: duration-reached
        check: target.status == 'running' and days_since(target.started_at) >= target.planned_days
        reason: No readout before the planned duration (prevents peeking).
    effects:
      - set: {target.status: ended}
      - create: Readout

  decide:
    description: Record a ship / iterate / kill / escalate decision based on a readout.
    actor: [pm]
    target: Experiment
    params:
      outcome: {enum: [ship, iterate, kill, escalate]}
      rationale: {type: string}
    preconditions:
      - id: has-readout
        check: exists(target.readout)
        reason: Decisions are based on a readout.
      - id: guardrail-blocks-ship
        check: not (params.outcome == 'ship' and target.readout.guardrail_regressed)
        reason: A guardrail regression blocks shipping; escalate instead.
    effects:
      - set: {target.status: decided}
    records_decision: true

# Note: there is deliberately no action that changes primary_metric after approval.
