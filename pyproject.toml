[project]
name = "toprope"
version = "0.0.0"
description = "Correctness layer and software factory: declared domains compiled into verified software."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "jsonschema>=4.20",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toprope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
