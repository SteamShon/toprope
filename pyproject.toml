[project]
name = "toprope"
version = "0.0.0"
description = "Correctness layer and software factory: declared domains compiled into verified software."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "pydantic>=2.7,<3",
    "mcp>=2.3,<3",
    "pyjwt>=2.9",
    "uvicorn>=0.30",
    "hypothesis>=6.100",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
toprope-server = "toprope.adapters.mcp.cli:main"
toprope-harness = "toprope.harness.cli:main"
toprope-worldmap = "toprope.worldmap.cli:main"
toprope-commits = "toprope.commits.cli:main"
toprope-run = "toprope.adapters.cli:main"
toprope-init = "toprope.adapters.cli.start:init_main"
toprope-try = "toprope.adapters.cli.start:try_main"
toprope-set = "toprope.adapters.cli.start:set_main"
toprope-rule = "toprope.adapters.cli.rule:rule_main"
toprope-add = "toprope.adapters.cli.rule:add_main"
toprope-rename = "toprope.adapters.cli.rule:rename_main"
toprope-remove = "toprope.adapters.cli.rule:remove_main"
toprope-change = "toprope.adapters.cli.change:main"
toprope-apply = "toprope.adapters.cli.apply:main"
toprope-interview = "toprope.adapters.cli.interview:main"
toprope-import = "toprope.importers.cli:main"
toprope-proxy = "toprope.proxy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.20",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toprope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
