name: human-request

# A human request (ADR-0039): steps only the researcher may take, written as
# .toprope/requests/<id>.yaml on a work branch. `plan` validates the request and shows it on
# this run's page; `act` waits until the researcher approves the run (environment
# `researcher`, required reviewer), then runs the steps as the approver and pushes the
# result to the branch. If a step fails, the work of the steps before it is still pushed, the
# request keeps the steps that are left, and the run ends red.
on:
  push:
    branches-ignore: [main, develop]
    paths: [".toprope/requests/*.yaml"]

permissions:
  contents: read

concurrency:
  group: human-request-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request: ${{ steps.find.outputs.request }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find the request
        id: find
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE" 2>/dev/null; then range="$BEFORE..$GITHUB_SHA"; else range="$GITHUB_SHA~1..$GITHUB_SHA"; fi
          git diff --name-only --diff-filter=AM "$range" -- '.toprope/requests/*.yaml' > "$RUNNER_TEMP/requests.txt"
          n=$(wc -l < "$RUNNER_TEMP/requests.txt")
          if [ "$n" -ne 1 ]; then echo "push exactly one new or changed request (found $n)"; cat "$RUNNER_TEMP/requests.txt"; exit 1; fi
          echo "request=$(cat "$RUNNER_TEMP/requests.txt")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check it and show it
        env:
          REQUEST: ${{ steps.find.outputs.request }}
        run: |
          pip install --quiet .   # the package, so the page can show what a confirm step confirms (B5)
          python tools/human_request.py check "$REQUEST"
          python tools/human_request.py render "$REQUEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`. Approve this run to take these steps as yourself." >> "$GITHUB_STEP_SUMMARY"

  act:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120        # uncached checks of two changed declarations can take tens of minutes
    environment: researcher
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}          # exactly what `plan` showed
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: TLC, pinned as in the tla workflow (an approval needs its check, ADR-0043)
        env:
          TLC_VERSION: v1.8.0
          TLC_SHA256: e1f11b75c4b5bc4478ba0ac5cb6ae28e40a01b0016bc33e0aa97da22dfdbcd7f
        run: |
          # The download sometimes returns a partial or wrong file: retry until the hash matches.
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/tla2tools.jar" \
              "https://github.com/tlaplus/tlaplus/releases/download/$TLC_VERSION/tla2tools.jar" \
              && echo "$TLC_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c - && break
            if [ "$i" = 5 ]; then exit 1; fi
            sleep $((i * 10))
          done
          echo "TOPROPE_TLC_JAR=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Who approved
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          login=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq '[.[] | select(.state == "approved")] | last | .user.login')
          if [ -z "$login" ] || [ "$login" = "null" ]; then echo "no approval found"; exit 1; fi
          echo "login=$login" >> "$GITHUB_OUTPUT"
      - name: The branch is still at this run's commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # A re-run of a red run would take the request's steps again, from the old state
          head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$BRANCH is at ${head:-nothing}, no longer at this run's commit $GITHUB_SHA (a re-run, or a later push). Fix: do not re-run this run; push a change to the request (the rest an earlier run left in it) and approve that run"
            exit 1
          fi
      - name: Take the steps as the approver
        id: take
        env:
          REQUEST: ${{ needs.plan.outputs.request }}
          APPROVER: ${{ steps.who.outputs.login }}
        run: |
          uv sync --quiet
          # `run` writes how far it got even when a step fails, then exits non-zero (the job ends red)
          uv run python tools/human_request.py run "$REQUEST" --approver "$APPROVER" > "$RUNNER_TEMP/done.json"
          cat "$RUNNER_TEMP/done.json"
      # Also after a failed step: the steps before it are kept (ADR-0050, 2), and the request is
      # rewritten to the steps that are left. Nothing is pushed if no step ran.
      - name: Commit and push
        id: push
        if: ${{ !cancelled() && (steps.take.outcome == 'success' || steps.take.outcome == 'failure') }}
        env:
          REQUEST: ${{ needs.plan.outputs.request }}
          APPROVER: ${{ steps.who.outputs.login }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DONE: ${{ runner.temp }}/done.json
        run: |
          if [ ! -s "$DONE" ]; then echo "no step ran: nothing to push"; exit 0; fi
          person=$(jq -r '.as' "$DONE")
          ran=$(jq -r '.steps' "$DONE")
          failed=$(jq -r '.failed.step // 0' "$DONE")
          if [ "$ran" -eq 0 ]; then echo "step 1 failed: nothing ran, nothing to push"; exit 0; fi
          summary=$(uv run python -c "import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))['summary'])" "$REQUEST")
          uv run python tools/human_request.py record "$REQUEST" --approver "$APPROVER" --as "$person" --run-url "$RUN_URL" --done "$DONE"
          if [ "$failed" -eq 0 ]; then
            git rm --quiet "$REQUEST"
          else
            summary="$summary ($(jq -r '.label + (if .rest then "; what is left stays in the request" else "" end)' "$DONE"))"
          fi
          git add -A
          git -c user.name="toprope-human-request" -c user.email="actions@users.noreply.github.com" \
            commit --quiet --author "$person" -m "$summary" \
            -m "Approved-by: $APPROVER (GitHub environment review)" -m "Approval: $RUN_URL"
          git push origin "HEAD:refs/heads/$BRANCH"     # a fast-forward of the approved commit, or nothing
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Run the status check on the new head
        if: ${{ !cancelled() && steps.push.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then gh workflow run status.yml --ref "$BRANCH" -f pr="$pr"; fi
