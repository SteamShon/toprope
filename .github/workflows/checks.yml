name: checks

# Runs the rules AGENTS.md lists as enforced by a check ("Rules and what enforces them"):
# the test suite, and the frozen experiment instruments.
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Tests (memory and SQLite stores)
        run: uv run pytest -q
      - name: Frozen instruments unchanged (amend records every change)
        run: uv run python experiments/tools/instruments.py verify experiments/m1/instruments --run
      - name: M2's preregistration unchanged once frozen (ADR-0054)
        run: |
          if [ -f experiments/m2/FROZEN.json ]; then
            uv run python experiments/tools/instruments.py verify experiments/m2
          else
            echo "M2's preregistration is not frozen yet"
          fi
      - name: Self-domain logs only extend the base's (AGENTS.md, Self domains)
        if: github.event_name == 'pull_request'
        run: uv run python tools/logs_check.py --base "origin/${{ github.base_ref }}"
