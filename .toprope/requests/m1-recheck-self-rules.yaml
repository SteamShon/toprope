summary: Confirm, approve, deploy and verify the self domains' promoted outcome rules
  and Authoring's bundle questions (M1 recheck; third run, after TLC's state space was fixed in #195)
steps:
- run:
    member: authoring
    action: confirm_all_proposed
    target: authoring
- run:
    member: authoring
    action: commit_draft
    target: authoring
- run:
    member: authoring
    action: check_commit
    target: $commit
- run:
    member: authoring
    action: approve_commit
    target: $commit
- run:
    member: authoring
    action: deliver
    target: $commit
    params:
      environment: local
- run:
    member: delivery
    action: preview
    target: authoring:$commit:local
- run:
    member: delivery
    action: deploy
    target: authoring:$commit:local
- run:
    member: delivery
    action: run_probes
    target: authoring:$commit:local
- run:
    member: delivery
    action: verify
    target: authoring:$commit:local
- run:
    member: authoring
    workspace: toprope.delivery.workspace.yaml
    action: confirm_all_proposed
    target: delivery
- run:
    member: authoring
    workspace: toprope.delivery.workspace.yaml
    action: commit_draft
    target: delivery
- run:
    member: authoring
    workspace: toprope.delivery.workspace.yaml
    action: check_commit
    target: $commit
- run:
    member: authoring
    workspace: toprope.delivery.workspace.yaml
    action: approve_commit
    target: $commit
- run:
    member: authoring
    workspace: toprope.delivery.workspace.yaml
    action: deliver
    target: $commit
    params:
      environment: local
- run:
    member: delivery
    action: preview
    target: delivery:$commit:local
- run:
    member: delivery
    action: deploy
    target: delivery:$commit:local
- run:
    member: delivery
    action: run_probes
    target: delivery:$commit:local
- run:
    member: delivery
    action: verify
    target: delivery:$commit:local
