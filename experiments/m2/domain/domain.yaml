    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/49
    status: proposed
  remove_asset_from_watchlist_by_id:
    description: Remove an asset by symbol from a specific watchlist.
    actor:
    - unassigned
    params:
      symbol:
        type: string
        optional: false
    target: Watchlist
    effects:
    - call: mcp:remove_asset_from_watchlist_by_id
      with:
        watchlist_id: target.id
        symbol: params.symbol
      reply: record_remove_asset_from_watchlist_by_id
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/50
    status: proposed
  record_place_stock_order:
    description: Record the server's answer to place_stock_order.
    actor:
    - external:kernel
    target: ClientOrder
    params:
      ok:
        type: boolean
    preconditions:
    - id: place-stock-order-done
      check: params.ok == true
      reason: The server did not do it (place_stock_order).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/0
    status: proposed
  record_place_crypto_order:
