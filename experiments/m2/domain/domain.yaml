domain: domain
version: 1
roles:
- unassigned
objects:
  Order:
    description: An Order, as the server keeps it.
    properties:
      status:
        enum:
        - proposed
        - approved
        - declined
        - cancel_proposed
        - cancel_approved
        - replace_proposed
        - replace_approved
        - pending_new
        - accepted
        - new
        - partially_filled
        - done_for_day
        - pending_cancel
        - pending_replace
        - accepted_for_bidding
        - stopped
        - suspended
        - calculated
        - held
        - filled
        - canceled
        - expired
        - replaced
        - rejected
      symbol:
        type: string
        optional: true
      side:
        type: string
        optional: true
      qty:
        type: string
        optional: true
      notional:
        type: string
        optional: true
      type:
        type: string
        optional: true
      time_in_force:
        type: string
        optional: true
      limit_price:
        type: string
        optional: true
      stop_price:
        type: string
        optional: true
      trail_price:
        type: string
        optional: true
      trail_percent:
        type: string
        optional: true
      extended_hours:
        type: boolean
        optional: true
      order_class:
        type: string
        optional: true
      take_profit_limit_price:
        type: string
        optional: true
      stop_loss_stop_price:
        type: string
        optional: true
      stop_loss_limit_price:
        type: string
        optional: true
      replace_client_order_id:
        type: string
        optional: true
      replace_limit_price:
        type: string
        optional: true
      replace_notional:
        type: string
        optional: true
      replace_qty:
        type: string
        optional: true
      replace_stop_price:
        type: string
        optional: true
      replace_time_in_force:
        enum:
        - day
        - gtc
        - opg
        - cls
        - ioc
        - fok
        optional: true
      replace_trail:
        type: string
        optional: true
      filled_avg_price:
        type: string
        optional: true
    source:
      kind: interview
      ref: interview:interview/log.jsonl#L7
      quote: 'status: pending_new, accepted, new, partially_filled, done_for_day,
        pending_cancel, pending_replace, accepted_for_bidding, stopped, suspended,
        calculated, held, filled, canceled, expired, replaced, rejected; starts new'
    status: proposed
  CorporateActionAnnouncement:
    description: A CorporateActionAnnouncement, as the server keeps it.
    properties: {}
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  Asset:
    description: An Asset, as the server keeps it.
    properties: {}
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/25
    status: proposed
  Position:
    description: A Position, as the server keeps it.
    properties:
      state:
        enum:
        - held
        - close_proposed
        - close_approved
        - closed
      close_qty:
        type: number
        optional: true
      close_percentage:
        type: number
        optional: true
    source:
      kind: interview
      ref: interview:interview/log.jsonl#L8
      quote: 'state: held, closed; starts held'
    status: proposed
  Account:
    description: An Account, as the server keeps it.
    properties: {}
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
links:
  position_account:
    from: Position
    to: Account
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  position_asset:
    from: Position
    to: Asset
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  order_account:
    from: Order
    to: Account
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  order_asset:
    from: Order
    to: Asset
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  announcement_initiating_asset:
    from: CorporateActionAnnouncement
    to: Asset
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  announcement_target_asset:
    from: CorporateActionAnnouncement
    to: Asset
    cardinality: many-to-one
    required: false
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
actions:
  place_stock_order:
    description: Place an approved stock or ETF order, as it was approved.
    actor:
    - unassigned
    effects:
    - call: mcp:place_stock_order
      with:
        client_order_id: target.id
        symbol: target.symbol
        side: target.side
        qty: target.qty
        notional: target.notional
        type: target.type
        time_in_force: target.time_in_force
        limit_price: target.limit_price
        stop_price: target.stop_price
        trail_price: target.trail_price
        trail_percent: target.trail_percent
        extended_hours: target.extended_hours
        order_class: target.order_class
        take_profit_limit_price: target.take_profit_limit_price
        stop_loss_stop_price: target.stop_loss_stop_price
        stop_loss_limit_price: target.stop_loss_limit_price
      reply: record_place_stock_order
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/0
    status: proposed
    target: Order
  cancel_order_by_id:
    description: Cancel a specific order by its ID.
    actor:
    - unassigned
    params: {}
    target: Order
    effects:
    - call: mcp:cancel_order_by_id
      with:
        order_id: target.id
      reply: record_cancel_order_by_id
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/35
    status: proposed
  replace_order_by_id:
    description: Replaces an existing open order with updated parameters. At least
      one optional field must be provided.
    actor:
    - unassigned
    target: Order
    effects:
    - call: mcp:replace_order_by_id
      with:
        order_id: target.id
        client_order_id: target.replace_client_order_id
        limit_price: target.replace_limit_price
        notional: target.replace_notional
        qty: target.replace_qty
        stop_price: target.replace_stop_price
        time_in_force: target.replace_time_in_force
        trail: target.replace_trail
      reply: record_replace_order_by_id
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/36
    status: proposed
  close_position:
    description: Closes a specific position for a single symbol by placing a sell
      order. If the market is closed, the sell order will remain queued and execute
      at the next market open.
    actor:
    - unassigned
    target: Position
    effects:
    - call: mcp:close_position
      with:
        symbol_or_asset_id: target.id
        qty: target.close_qty
        percentage: target.close_percentage
      reply: record_close_position
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/41
    status: proposed
  record_place_stock_order:
    description: Record the server's answer to place_stock_order.
    actor:
    - external:kernel
    target: Order
    params:
      ok:
        type: boolean
    preconditions:
    - id: place-stock-order-done
      check: params.ok == true
      reason: The server did not do it (place_stock_order).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/0
    status: proposed
  record_cancel_order_by_id:
    description: Record the server's answer to cancel_order_by_id.
    actor:
    - external:kernel
    target: Order
    params:
      ok:
        type: boolean
    preconditions:
    - id: cancel-order-by-id-done
      check: params.ok == true
      reason: The server did not do it (cancel_order_by_id).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/35
    status: proposed
  record_replace_order_by_id:
    description: Record the server's answer to replace_order_by_id.
    actor:
    - external:kernel
    target: Order
    params:
      ok:
        type: boolean
    preconditions:
    - id: replace-order-by-id-done
      check: params.ok == true
      reason: The server did not do it (replace_order_by_id).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/36
    status: proposed
  record_close_position:
    description: Record the server's answer to close_position.
    actor:
    - external:kernel
    target: Position
    params:
      ok:
        type: boolean
    preconditions:
    - id: close-position-done
      check: params.ok == true
      reason: The server did not do it (close_position).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/41
    status: proposed
  propose_order:
    actor:
    - unassigned
    description: Propose a stock or ETF order; nothing is sent to Alpaca until a person
      approves it.
    creates: Order
    params:
      symbol:
        type: string
        optional: false
      side:
        type: string
        optional: false
      qty:
        type: string
        optional: true
      notional:
        type: string
        optional: true
      type:
        type: string
        optional: true
      time_in_force:
        type: string
        optional: true
      limit_price:
        type: string
        optional: true
      stop_price:
        type: string
        optional: true
      trail_price:
        type: string
        optional: true
      trail_percent:
        type: string
        optional: true
      extended_hours:
        type: boolean
        optional: true
      order_class:
        type: string
        optional: true
      take_profit_limit_price:
        type: string
        optional: true
      stop_loss_stop_price:
        type: string
        optional: true
      stop_loss_limit_price:
        type: string
        optional: true
    effects:
    - set:
        target.symbol: params.symbol
        target.side: params.side
        target.qty: params.qty
        target.notional: params.notional
        target.type: params.type
        target.time_in_force: params.time_in_force
        target.limit_price: params.limit_price
        target.stop_price: params.stop_price
        target.trail_price: params.trail_price
        target.trail_percent: params.trail_percent
        target.extended_hours: params.extended_hours
        target.order_class: params.order_class
        target.take_profit_limit_price: params.take_profit_limit_price
        target.stop_loss_stop_price: params.stop_loss_stop_price
        target.stop_loss_limit_price: params.stop_loss_limit_price
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  approve_order:
    actor:
    - unassigned
    description: Approve a proposed order.
    target: Order
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  decline_order:
    actor:
    - unassigned
    description: Decline a proposed order.
    target: Order
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  propose_cancel:
    actor:
    - unassigned
    description: Propose cancelling an open order.
    target: Order
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  approve_cancel:
    actor:
    - unassigned
    description: Approve a proposed cancellation.
    target: Order
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  decline_cancel:
    actor:
    - unassigned
    description: Decline a proposed cancellation.
    target: Order
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  propose_replace:
    actor:
    - unassigned
    description: Propose replacing an open order with new parameters.
    target: Order
    params:
      client_order_id:
        type: string
        optional: true
      limit_price:
        type: string
        optional: true
      notional:
        type: string
        optional: true
      qty:
        type: string
        optional: true
      stop_price:
        type: string
        optional: true
      time_in_force:
        enum:
        - day
        - gtc
        - opg
        - cls
        - ioc
        - fok
        optional: true
      trail:
        type: string
        optional: true
    effects:
    - set:
        target.replace_client_order_id: params.client_order_id
        target.replace_limit_price: params.limit_price
        target.replace_notional: params.notional
        target.replace_qty: params.qty
        target.replace_stop_price: params.stop_price
        target.replace_time_in_force: params.time_in_force
        target.replace_trail: params.trail
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  approve_replace:
    actor:
    - unassigned
    description: Approve a proposed replacement.
    target: Order
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  decline_replace:
    actor:
    - unassigned
    description: Decline a proposed replacement.
    target: Order
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  propose_close:
    actor:
    - unassigned
    description: Propose closing a position.
    target: Position
    params:
      qty:
        type: number
        optional: true
      percentage:
        type: number
        optional: true
    effects:
    - set:
        target.close_qty: params.qty
        target.close_percentage: params.percentage
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  approve_close:
    actor:
