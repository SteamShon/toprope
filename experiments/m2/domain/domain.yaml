        order_id: target.id
      reply: record_cancel_order_by_id
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/35
    status: proposed
  replace_order_by_id:
    description: Replaces an existing open order with updated parameters. At least
      one optional field must be provided.
    actor:
    - unassigned
    params:
      client_order_id:
        type: string
        optional: true
      limit_price:
        type: string
        optional: true
      notional:
        type: string
        optional: true
      qty:
        type: string
        optional: true
      stop_price:
        type: string
        optional: true
      time_in_force:
        enum:
        - day
        - gtc
        - opg
        - cls
        - ioc
        - fok
        optional: true
      trail:
        type: string
        optional: true
    target: Order
    effects:
    - call: mcp:replace_order_by_id
      with:
        order_id: target.id
        client_order_id: params.client_order_id
        limit_price: params.limit_price
        notional: params.notional
        qty: params.qty
        stop_price: params.stop_price
        time_in_force: params.time_in_force
        trail: params.trail
      reply: record_replace_order_by_id
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/36
    status: proposed
  get_order_by_client_id:
    description: 'Retrieves a single order specified by the client order ID. Note:
      if the order was replaced, this returns the original order (status "replaced")
      with a replaced_by field pointing to the new order ID.'
    actor:
    - unassigned
    params: {}
    target: ClientOrder
    effects:
    - call: mcp:get_order_by_client_id
      with:
        client_order_id: target.id
      reply: record_get_order_by_client_id
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/37
    status: proposed
  get_open_position:
    description: Retrieves and formats details for a specific open position.
    actor:
    - unassigned
    params: {}
    target: SymbolOrAsset
    effects:
    - call: mcp:get_open_position
      with:
        symbol_or_asset_id: target.id
      reply: record_get_open_position
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/40
    status: proposed
  close_position:
    description: Closes a specific position for a single symbol by placing a sell
      order. If the market is closed, the sell order will remain queued and execute
      at the next market open.
    actor:
    - unassigned
    params:
      qty:
        type: number
        optional: true
      percentage:
        type: number
        optional: true
    target: SymbolOrAsset
    effects:
    - call: mcp:close_position
      with:
        symbol_or_asset_id: target.id
        qty: params.qty
        percentage: params.percentage
      reply: record_close_position
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/41
    status: proposed
  do_not_exercise_options_position:
    description: Submits a do-not-exercise instruction for a held option contract.
    actor:
    - unassigned
    params: {}
    target: SymbolOrContract
    effects:
    - call: mcp:do_not_exercise_options_position
      with:
        symbol_or_contract_id: target.id
      reply: record_do_not_exercise_options_position
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/42
    status: proposed
  exercise_options_position:
    description: Exercises a held option contract, converting it into the underlying
