domain: domain
version: 1
roles:
- unassigned
objects:
  Order:
    description: An Order, as the server keeps it.
    properties:
      status:
        enum:
        - pending_new
        - accepted
        - new
        - partially_filled
        - done_for_day
        - pending_cancel
        - pending_replace
        - accepted_for_bidding
        - stopped
        - suspended
        - calculated
        - held
        - filled
        - canceled
        - expired
        - replaced
        - rejected
    source:
      kind: interview
      ref: interview:interview/log.jsonl#L7
      quote: 'status: pending_new, accepted, new, partially_filled, done_for_day,
        pending_cancel, pending_replace, accepted_for_bidding, stopped, suspended,
        calculated, held, filled, canceled, expired, replaced, rejected; starts new'
    status: proposed
  CorporateActionAnnouncement:
    description: A CorporateActionAnnouncement, as the server keeps it.
    properties: {}
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  Asset:
    description: An Asset, as the server keeps it.
    properties: {}
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/25
    status: proposed
  Position:
    description: A Position, as the server keeps it.
    properties:
      state:
        enum:
        - held
        - closed
    source:
      kind: interview
      ref: interview:interview/log.jsonl#L8
      quote: 'state: held, closed; starts held'
    status: proposed
  Account:
    description: An Account, as the server keeps it.
    properties: {}
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
links:
  position_account:
    from: Position
    to: Account
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  position_asset:
    from: Position
    to: Asset
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  order_account:
    from: Order
    to: Account
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  order_asset:
    from: Order
    to: Asset
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  announcement_initiating_asset:
    from: CorporateActionAnnouncement
    to: Asset
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  announcement_target_asset:
    from: CorporateActionAnnouncement
    to: Asset
    cardinality: many-to-one
    required: false
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
actions:
  place_stock_order:
    description: Place a stock or ETF order.
    actor:
    - unassigned
    params:
      symbol:
        type: string
        optional: false
      side:
        type: string
        optional: false
      qty:
        type: string
        optional: true
      notional:
        type: string
        optional: true
      type:
        type: string
        optional: true
      time_in_force:
        type: string
        optional: true
      limit_price:
        type: string
        optional: true
      stop_price:
        type: string
        optional: true
      trail_price:
        type: string
        optional: true
      trail_percent:
        type: string
        optional: true
      extended_hours:
        type: boolean
        optional: true
      order_class:
        type: string
        optional: true
      take_profit_limit_price:
        type: string
        optional: true
      stop_loss_stop_price:
        type: string
        optional: true
      stop_loss_limit_price:
        type: string
        optional: true
    target: Order
    effects:
    - call: mcp:place_stock_order
      with:
        client_order_id: target.id
        symbol: params.symbol
        side: params.side
        qty: params.qty
        notional: params.notional
        type: params.type
        time_in_force: params.time_in_force
        limit_price: params.limit_price
        stop_price: params.stop_price
        trail_price: params.trail_price
        trail_percent: params.trail_percent
        extended_hours: params.extended_hours
        order_class: params.order_class
        take_profit_limit_price: params.take_profit_limit_price
        stop_loss_stop_price: params.stop_loss_stop_price
        stop_loss_limit_price: params.stop_loss_limit_price
      reply: record_place_stock_order
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/0
    status: proposed
  cancel_order_by_id:
    description: Cancel a specific order by its ID.
    actor:
    - unassigned
    params: {}
    target: Order
    effects:
    - call: mcp:cancel_order_by_id
      with:
        order_id: target.id
      reply: record_cancel_order_by_id
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/35
    status: proposed
  replace_order_by_id:
    description: Replaces an existing open order with updated parameters. At least
      one optional field must be provided.
    actor:
    - unassigned
    params:
      client_order_id:
        type: string
        optional: true
      limit_price:
        type: string
        optional: true
      notional:
        type: string
        optional: true
      qty:
        type: string
        optional: true
      stop_price:
        type: string
        optional: true
      time_in_force:
        enum:
        - day
        - gtc
        - opg
        - cls
        - ioc
        - fok
        optional: true
      trail:
        type: string
        optional: true
    target: Order
    effects:
    - call: mcp:replace_order_by_id
      with:
        order_id: target.id
        client_order_id: params.client_order_id
        limit_price: params.limit_price
        notional: params.notional
        qty: params.qty
        stop_price: params.stop_price
        time_in_force: params.time_in_force
        trail: params.trail
      reply: record_replace_order_by_id
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/36
    status: proposed
  close_position:
    description: Closes a specific position for a single symbol by placing a sell
      order. If the market is closed, the sell order will remain queued and execute
      at the next market open.
    actor:
    - unassigned
    params:
      qty:
        type: number
        optional: true
      percentage:
        type: number
        optional: true
    target: Position
    effects:
    - call: mcp:close_position
      with:
        symbol_or_asset_id: target.id
        qty: params.qty
        percentage: params.percentage
      reply: record_close_position
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/41
    status: proposed
  record_place_stock_order:
    description: Record the server's answer to place_stock_order.
    actor:
    - external:kernel
    target: Order
    params:
      ok:
        type: boolean
    preconditions:
    - id: place-stock-order-done
      check: params.ok == true
      reason: The server did not do it (place_stock_order).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/0
    status: proposed
  record_cancel_order_by_id:
    description: Record the server's answer to cancel_order_by_id.
    actor:
    - external:kernel
    target: Order
    params:
      ok:
        type: boolean
    preconditions:
    - id: cancel-order-by-id-done
      check: params.ok == true
      reason: The server did not do it (cancel_order_by_id).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/35
    status: proposed
  record_replace_order_by_id:
    description: Record the server's answer to replace_order_by_id.
    actor:
    - external:kernel
    target: Order
    params:
      ok:
        type: boolean
    preconditions:
    - id: replace-order-by-id-done
      check: params.ok == true
      reason: The server did not do it (replace_order_by_id).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/36
    status: proposed
  record_close_position:
    description: Record the server's answer to close_position.
    actor:
    - external:kernel
    target: Position
    params:
      ok:
        type: boolean
    preconditions:
    - id: close-position-done
      check: params.ok == true
      reason: The server did not do it (close_position).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/41
    status: proposed
purpose:
  problem: 이 도메인은 계좌 주인을 위해서 에이전트랑 사람이 포트폴리오를 운영하는 문제를 해결하는 거야.
  success_metric:
    name: 총 계좌의 넷 밸류
    direction: up
  announcement: 서프라이즈 없이 계좌 주인이 이해한 대로 매매가 이루어지고 그 결과 2주 후에 계좌 잔액이 증가했다.
