      ref: uvx alpaca-mcp-server==2.4.1#/tools/46
    status: proposed
  update_watchlist_by_id:
    description: 'Update an existing watchlist. IMPORTANT: this replaces the entire
      watchlist. You must include the symbols parameter with the full list of desired
      symbols, otherwise all assets will be removed.'
    actor:
    - unassigned
    params:
      name:
        type: string
        optional: true
    target: Watchlist
    effects:
    - call: mcp:update_watchlist_by_id
      with:
        watchlist_id: target.id
        name: params.name
      reply: record_update_watchlist_by_id
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/47
    status: proposed
  add_asset_to_watchlist_by_id:
    description: Add an asset by symbol to a specific watchlist.
    actor:
    - unassigned
    params:
      symbol:
        type: string
        optional: true
    creates: Watchlist
    effects:
    - call: mcp:add_asset_to_watchlist_by_id
      with:
        watchlist_id: target.id
        symbol: params.symbol
      reply: record_add_asset_to_watchlist_by_id
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/48
    status: proposed
  delete_watchlist_by_id:
    description: Delete a specific watchlist by its ID.
    actor:
    - unassigned
    params: {}
    target: Watchlist
    effects:
