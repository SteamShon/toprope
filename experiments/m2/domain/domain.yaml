purpose:
  problem: 이 도메인은 계좌 주인을 위해서 에이전트랑 사람이 포트폴리오를 운영하는 문제를 해결하는 거야.
  success_metric:
    name: 총 계좌의 넷 밸류
    direction: up
  announcement: 서프라이즈 없이 계좌 주인이 이해한 대로 매매가 이루어지고 그 결과 2주 후에 계좌 잔액이 증가했다.
