actions:
  place_stock_order:
    description: Place a stock or ETF order.
    actor:
    - unassigned
    params:
      symbol:
        type: string
        optional: false
      side:
        type: string
        optional: false
      qty:
        type: string
        optional: true
      notional:
        type: string
        optional: true
      type:
        type: string
        optional: true
      time_in_force:
        type: string
        optional: true
      limit_price:
        type: string
        optional: true
      stop_price:
        type: string
        optional: true
      trail_price:
        type: string
        optional: true
      trail_percent:
        type: string
        optional: true
      extended_hours:
        type: boolean
        optional: true
      order_class:
        type: string
        optional: true
      take_profit_limit_price:
        type: string
        optional: true
      stop_loss_stop_price:
        type: string
        optional: true
      stop_loss_limit_price:
        type: string
        optional: true
    target: ClientOrder
    effects:
    - call: mcp:place_stock_order
      with:
        client_order_id: target.id
        symbol: params.symbol
        side: params.side
        qty: params.qty
        notional: params.notional
        type: params.type
        time_in_force: params.time_in_force
        limit_price: params.limit_price
        stop_price: params.stop_price
        trail_price: params.trail_price
        trail_percent: params.trail_percent
        extended_hours: params.extended_hours
        order_class: params.order_class
        take_profit_limit_price: params.take_profit_limit_price
        stop_loss_stop_price: params.stop_loss_stop_price
        stop_loss_limit_price: params.stop_loss_limit_price
      reply: record_place_stock_order
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/0
    status: proposed
  place_crypto_order:
    description: Place a cryptocurrency order.
    actor:
    - unassigned
    params:
      symbol:
        type: string
        optional: false
      side:
        type: string
        optional: false
      qty:
        type: string
        optional: true
      notional:
        type: string
        optional: true
      type:
        type: string
        optional: true
      time_in_force:
        type: string
        optional: true
      limit_price:
        type: string
        optional: true
      stop_price:
        type: string
        optional: true
    target: ClientOrder
    effects:
    - call: mcp:place_crypto_order
      with:
        client_order_id: target.id
        symbol: params.symbol
        side: params.side
        qty: params.qty
        notional: params.notional
        type: params.type
        time_in_force: params.time_in_force
        limit_price: params.limit_price
        stop_price: params.stop_price
      reply: record_place_crypto_order
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/1
    status: proposed
  place_option_order:
    description: 'Place an options order (single-leg or multi-leg).


      For single-leg orders, provide symbol, side, and qty.

      For multi-leg orders, provide qty, legs, and optionally

      order_class="mleg" (auto-inferred). Symbol and side on the

      parent are not needed for multi-leg.'
    actor:
    - unassigned
    params:
      qty:
        type: string
        optional: false
      type:
        type: string
        optional: true
      time_in_force:
        type: string
        optional: true
      symbol:
        type: string
        optional: true
      side:
        type: string
        optional: true
      position_intent:
        type: string
        optional: true
      limit_price:
        type: string
        optional: true
      stop_price:
        type: string
        optional: true
      order_class:
        type: string
        optional: true
    target: ClientOrder
    effects:
    - call: mcp:place_option_order
      with:
        client_order_id: target.id
        qty: params.qty
        type: params.type
        time_in_force: params.time_in_force
        symbol: params.symbol
        side: params.side
        position_intent: params.position_intent
        limit_price: params.limit_price
        stop_price: params.stop_price
        order_class: params.order_class
      reply: record_place_option_order
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/2
    status: proposed
  get_locate:
    description: Returns a single locate request by its ID. Not available in paper
      trading.
    actor:
    - unassigned
    params: {}
    target: Locate
    effects:
    - call: mcp:get_locate
      with:
        locate_id: target.id
      reply: record_get_locate
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/16
    status: proposed
  get_account_activities:
    description: Returns a list of account activities such as fills, dividends, and
      transfers.
    actor:
    - unassigned
    params:
      category:
        enum:
        - trade_activity
        - non_trade_activity
        optional: true
      date:
        type: datetime
        optional: true
      until:
        type: datetime
        optional: true
      after:
        type: datetime
        optional: true
      direction:
        enum:
        - asc
        - desc
        optional: true
      page_size:
        type: integer
        optional: true
      page_token:
        type: string
        optional: true
    target: Order
    effects:
    - call: mcp:get_account_activities
      with:
        order_id: target.id
        category: params.category
        date: params.date
        until: params.until
        after: params.after
        direction: params.direction
        page_size: params.page_size
        page_token: params.page_token
      reply: record_get_account_activities
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/19
    status: proposed
  get_account_activities_by_type:
    description: Returns account activity entries for a specific type of activity.
    actor:
    - unassigned
    params:
      date:
        type: datetime
        optional: true
      until:
        type: datetime
        optional: true
      after:
        type: datetime
        optional: true
      direction:
        enum:
        - asc
        - desc
        optional: true
      page_size:
        type: integer
        optional: true
      page_token:
        type: string
        optional: true
      activity_type:
        type: string
        optional: false
    target: Order
    effects:
    - call: mcp:get_account_activities_by_type
      with:
        order_id: target.id
        date: params.date
        until: params.until
        after: params.after
        direction: params.direction
        page_size: params.page_size
        page_token: params.page_token
        activity_type: params.activity_type
      reply: record_get_account_activities_by_type
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/20
    status: proposed
  get_asset:
    description: Retrieves and formats detailed information about a specific asset.
    actor:
    - unassigned
    params: {}
    target: SymbolOrAsset
    effects:
    - call: mcp:get_asset
      with:
        symbol_or_asset_id: target.id
      reply: record_get_asset
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/25
    status: proposed
  get_corporate_action_announcement:
    description: Retrieves a single corporate action announcement by ID.
    actor:
    - unassigned
    params: {}
    target: CorporateActionAnnouncement
    effects:
    - call: mcp:get_corporate_action_announcement
      with:
        id: target.id
      reply: record_get_corporate_action_announcement
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/29
    status: proposed
  get_option_contract:
    description: Retrieves a single option contract by symbol or contract ID.
    actor:
    - unassigned
    params: {}
    target: SymbolOr
    effects:
    - call: mcp:get_option_contract
      with:
        symbol_or_id: target.id
      reply: record_get_option_contract
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/31
    status: proposed
  get_orders:
    description: Retrieves and formats orders with the specified filters.
    actor:
    - unassigned
    params:
      status:
        enum:
        - open
        - closed
        - all
        optional: true
      limit:
        type: integer
        optional: true
      after:
        type: string
        optional: true
      until:
        type: string
        optional: true
      direction:
        enum:
        - asc
        - desc
        optional: true
      nested:
        type: boolean
        optional: true
      symbols:
        type: string
        optional: true
      side:
        type: string
        optional: true
      after_order_id:
        type: string
        optional: true
    target: BeforeOrder
    effects:
    - call: mcp:get_orders
      with:
        before_order_id: target.id
        status: params.status
        limit: params.limit
        after: params.after
        until: params.until
        direction: params.direction
        nested: params.nested
        symbols: params.symbols
        side: params.side
        after_order_id: params.after_order_id
      reply: record_get_orders
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/32
    status: proposed
  get_order_by_id:
    description: Retrieves a single order by its ID.
    actor:
    - unassigned
    params:
      nested:
        type: boolean
        optional: true
    target: Order
    effects:
    - call: mcp:get_order_by_id
      with:
        order_id: target.id
        nested: params.nested
      reply: record_get_order_by_id
    source:
