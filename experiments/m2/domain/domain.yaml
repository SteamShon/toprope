domain: domain
version: 1
roles:
- account_owner
- agent
objects:
  Order:
    description: An Order, as the server keeps it.
    properties:
      status:
        enum:
        - draft
        - proposed
        - approved
        - declined
        - cancel_proposed
        - cancel_approved
        - replace_proposed
        - replace_approved
        - pending_new
        - accepted
        - new
        - partially_filled
        - done_for_day
        - pending_cancel
        - pending_replace
        - accepted_for_bidding
        - stopped
        - suspended
        - calculated
        - held
        - filled
        - canceled
        - expired
        - replaced
        - rejected
      symbol:
        type: string
        optional: true
      side:
        type: string
        optional: true
      qty:
        type: number
        optional: true
      notional:
        type: number
        optional: true
      type:
        type: string
        optional: true
      time_in_force:
        type: string
        optional: true
      limit_price:
        type: number
        optional: true
      stop_price:
        type: string
        optional: true
      trail_price:
        type: string
        optional: true
      trail_percent:
        type: string
        optional: true
      extended_hours:
        type: boolean
        optional: true
      order_class:
        type: string
        optional: true
      take_profit_limit_price:
        type: string
        optional: true
      stop_loss_stop_price:
        type: string
        optional: true
      stop_loss_limit_price:
        type: string
        optional: true
      replace_client_order_id:
        type: string
        optional: true
      replace_limit_price:
        type: string
        optional: true
      replace_notional:
        type: string
        optional: true
      replace_qty:
        type: string
        optional: true
      replace_stop_price:
        type: string
        optional: true
      replace_time_in_force:
        enum:
        - day
        - gtc
        - opg
        - cls
        - ioc
        - fok
        optional: true
      replace_trail:
        type: string
        optional: true
      filled_avg_price:
        type: string
        optional: true
    source:
      kind: interview
      ref: interview:interview/log.jsonl#L7
      quote: 'status: pending_new, accepted, new, partially_filled, done_for_day,
        pending_cancel, pending_replace, accepted_for_bidding, stopped, suspended,
        calculated, held, filled, canceled, expired, replaced, rejected; starts new'
    status: proposed
  CorporateActionAnnouncement:
    description: A CorporateActionAnnouncement, as the server keeps it.
    properties: {}
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  Asset:
    description: An Asset, as the server keeps it.
    properties: {}
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/25
    status: proposed
  Position:
    description: A Position, as the server keeps it.
    properties:
      state:
        enum:
        - held
        - close_proposed
        - close_approved
        - closed
      close_qty:
        type: number
        optional: true
      close_percentage:
        type: number
        optional: true
      symbol:
        type: string
        optional: true
      qty:
        type: number
        optional: true
      avg_entry_price:
        type: string
        optional: true
      market_value:
        type: string
        optional: true
      unrealized_pl:
        type: string
        optional: true
      refreshed_at:
        type: datetime
        optional: true
    source:
      kind: interview
      ref: interview:interview/log.jsonl#L8
      quote: 'state: held, closed; starts held'
    status: proposed
  Account:
    description: An Account, as the server keeps it.
    properties:
      status:
        enum:
        - ACTIVE
      equity:
        type: number
        optional: true
      refreshed_at:
        type: datetime
        optional: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
links:
  position_account:
    from: Position
    to: Account
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  position_asset:
    from: Position
    to: Asset
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  order_account:
    from: Order
    to: Account
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  order_asset:
    from: Order
    to: Asset
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  announcement_initiating_asset:
    from: CorporateActionAnnouncement
    to: Asset
    cardinality: many-to-one
    required: true
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  announcement_target_asset:
    from: CorporateActionAnnouncement
    to: Asset
    cardinality: many-to-one
    required: false
    source:
      kind: interview
      ref: interview/log.jsonl
    status: proposed
  order_position:
    from: Order
    to: Position
    cardinality: many-to-one
    required: false
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
    status: proposed
actions:
  place_stock_order:
    description: Place an approved stock or ETF order, as it was approved.
    actor:
    - agent
    - account_owner
    effects:
    - call: mcp:place_stock_order
      with:
        client_order_id: target.id
        symbol: target.symbol
        side: target.side
        qty: target.qty
        notional: target.notional
        type: target.type
        time_in_force: target.time_in_force
        limit_price: target.limit_price
        stop_price: target.stop_price
        trail_price: target.trail_price
        trail_percent: target.trail_percent
        extended_hours: target.extended_hours
        order_class: target.order_class
        take_profit_limit_price: target.take_profit_limit_price
        stop_loss_stop_price: target.stop_loss_stop_price
        stop_loss_limit_price: target.stop_loss_limit_price
      reply: record_place_stock_order
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/0
    status: proposed
    target: Order
  cancel_order_by_id:
    description: Cancel a specific order by its ID.
    actor:
    - agent
    - account_owner
    params: {}
    target: Order
    effects:
    - call: mcp:cancel_order_by_id
      with:
        order_id: target.id
      reply: record_cancel_order_by_id
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/35
    status: proposed
  replace_order_by_id:
    description: Replaces an existing open order with updated parameters. At least
      one optional field must be provided.
    actor:
    - agent
    - account_owner
    target: Order
    effects:
    - call: mcp:replace_order_by_id
      with:
        order_id: target.id
        client_order_id: target.replace_client_order_id
        limit_price: target.replace_limit_price
        notional: target.replace_notional
        qty: target.replace_qty
        stop_price: target.replace_stop_price
        time_in_force: target.replace_time_in_force
        trail: target.replace_trail
      reply: record_replace_order_by_id
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/36
    status: proposed
  close_position:
    description: Closes a specific position for a single symbol by placing a sell
      order. If the market is closed, the sell order will remain queued and execute
      at the next market open.
    actor:
    - agent
    - account_owner
    target: Position
    effects:
    - call: mcp:close_position
      with:
        symbol_or_asset_id: target.id
        qty: target.close_qty
        percentage: target.close_percentage
      reply: record_close_position
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/41
    status: proposed
  record_place_stock_order:
    description: Record the server's answer to place_stock_order.
    actor:
    - external:kernel
    target: Order
    params:
      ok:
        type: boolean
    preconditions:
    - id: place-stock-order-done
      check: params.ok == true
      reason: The server did not do it (place_stock_order).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/0
    status: proposed
  record_cancel_order_by_id:
    description: Record the server's answer to cancel_order_by_id.
    actor:
    - external:kernel
    target: Order
    params:
      ok:
        type: boolean
    preconditions:
    - id: cancel-order-by-id-done
      check: params.ok == true
      reason: The server did not do it (cancel_order_by_id).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/35
    status: proposed
  record_replace_order_by_id:
    description: Record the server's answer to replace_order_by_id.
    actor:
    - external:kernel
    target: Order
    params:
      ok:
        type: boolean
    preconditions:
    - id: replace-order-by-id-done
      check: params.ok == true
      reason: The server did not do it (replace_order_by_id).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/36
    status: proposed
  record_close_position:
    description: Record the server's answer to close_position.
    actor:
    - external:kernel
    target: Position
    params:
      ok:
        type: boolean
    preconditions:
    - id: close-position-done
      check: params.ok == true
      reason: The server did not do it (close_position).
    source:
      kind: system
      ref: uvx alpaca-mcp-server==2.4.1#/tools/41
    status: proposed
  propose_order:
    actor:
    - agent
    - account_owner
    description: Draft a stock or ETF order; it is checked when it is submitted as
      a proposal, and nothing is sent to Alpaca until a person approves it.
    creates: Order
    params:
      symbol:
        type: string
        optional: false
      side:
        type: string
        optional: false
      qty:
        type: number
        optional: true
      notional:
        type: number
        optional: true
      type:
        type: string
        optional: true
      time_in_force:
        type: string
        optional: true
      limit_price:
        type: number
        optional: true
      stop_price:
        type: string
        optional: true
      trail_price:
        type: string
        optional: true
      trail_percent:
        type: string
        optional: true
      extended_hours:
        type: boolean
        optional: true
      order_class:
        type: string
        optional: true
      take_profit_limit_price:
        type: string
        optional: true
      stop_loss_stop_price:
        type: string
        optional: true
      stop_loss_limit_price:
        type: string
        optional: true
      account:
        ref: Account
      asset:
        ref: Asset
      position:
        ref: Position
        optional: true
    effects:
    - set:
        target.symbol: params.symbol
        target.side: params.side
        target.qty: params.qty
        target.notional: params.notional
        target.type: params.type
        target.time_in_force: params.time_in_force
        target.limit_price: params.limit_price
        target.stop_price: params.stop_price
        target.trail_price: params.trail_price
        target.trail_percent: params.trail_percent
        target.extended_hours: params.extended_hours
        target.order_class: params.order_class
        target.take_profit_limit_price: params.take_profit_limit_price
        target.stop_loss_stop_price: params.stop_loss_stop_price
        target.stop_loss_limit_price: params.stop_loss_limit_price
        target.order_account: params.account
        target.order_asset: params.asset
        target.order_position: params.position
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  approve_order:
    actor:
    - account_owner
    description: Approve a proposed order.
    target: Order
    source:
      kind: interview
      ref: interview:interview/log.jsonl#L13
      quote: '2: only a person, never an agent on its own'
    status: proposed
    requires: human
  decline_order:
    actor:
    - account_owner
    description: Decline a proposed order.
    target: Order
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  propose_cancel:
    actor:
    - agent
    - account_owner
    description: Propose cancelling an open order.
    target: Order
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  approve_cancel:
    actor:
    - account_owner
    description: Approve a proposed cancellation.
    target: Order
    source:
      kind: interview
      ref: interview:interview/log.jsonl#L20
      quote: '2: only a person, never an agent on its own'
    status: proposed
    requires: human
  decline_cancel:
    actor:
    - account_owner
    description: Decline a proposed cancellation.
    target: Order
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  propose_replace:
    actor:
    - agent
    - account_owner
    description: Propose replacing an open order with new parameters.
    target: Order
    params:
      client_order_id:
        type: string
        optional: true
      limit_price:
        type: string
        optional: true
      notional:
        type: string
        optional: true
      qty:
        type: string
        optional: true
      stop_price:
        type: string
        optional: true
      time_in_force:
        enum:
        - day
        - gtc
        - opg
        - cls
        - ioc
        - fok
        optional: true
      trail:
        type: string
        optional: true
    effects:
    - set:
        target.replace_client_order_id: params.client_order_id
        target.replace_limit_price: params.limit_price
        target.replace_notional: params.notional
        target.replace_qty: params.qty
        target.replace_stop_price: params.stop_price
        target.replace_time_in_force: params.time_in_force
        target.replace_trail: params.trail
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  approve_replace:
    actor:
    - account_owner
    description: Approve a proposed replacement.
    target: Order
    source:
      kind: interview
      ref: interview:interview/log.jsonl#L16
      quote: '2: only a person, never an agent on its own'
    status: proposed
    requires: human
  decline_replace:
    actor:
    - account_owner
    description: Decline a proposed replacement.
    target: Order
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  propose_close:
    actor:
    - agent
    - account_owner
    description: Propose closing a position.
    target: Position
    params:
      qty:
        type: number
        optional: true
      percentage:
        type: number
        optional: true
    effects:
    - set:
        target.close_qty: params.qty
        target.close_percentage: params.percentage
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  approve_close:
    actor:
    - account_owner
    description: Approve a proposed close.
    target: Position
    source:
      kind: interview
      ref: interview:interview/log.jsonl#L19
      quote: '1: only a person, never an agent on its own'
    status: proposed
    preconditions:
    - check: target.close_percentage <= 80 or 'account_owner' in actor.roles
      reason: Over 80 close_percentage, only the account_owner may approve a proposed
        close.
      source:
        kind: interview
        ref: interview:interview/log.jsonl#L17
        quote: close_percentage over 80, only account_owner
      status: proposed
      id: limit-close_percentage
    requires: human
  decline_close:
    actor:
    - account_owner
    description: Decline a proposed close.
    target: Position
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: '1'
    status: proposed
  submit_proposal:
    actor:
    - agent
    - account_owner
    description: Submit a drafted order as a proposal, within the limits.
    target: Order
    preconditions:
    - id: sell-within-80-percent-of-the-position
      check: target.side != 'sell' or target.qty * 100 <= target.order_position.qty
        * 80 or 'account_owner' in actor.roles
      reason: A sell over 80% of the position's shares is proposed by the account
        owner only.
      source:
        kind: interview
        ref: interview/log.jsonl
        quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
      status: proposed
    - id: buy-within-half-the-account
      check: target.side != 'buy' or (exists(target.notional) and target.notional
        * 2 <= target.order_account.equity) or (exists(target.limit_price) and exists(target.qty)
        and target.qty * target.limit_price * 2 <= target.order_account.equity)
      reason: A buy over 50% of the account's value is refused; a buy without notional
        or limit_price cannot be checked and is refused too.
      source:
        kind: interview
        ref: interview/log.jsonl
        quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
      status: proposed
    - id: position-refreshed-today
      check: target.side != 'sell' or days_since(target.order_position.refreshed_at)
        == 0
      reason: Refresh the position today before proposing a sell.
      source:
        kind: interview
        ref: interview/log.jsonl
        quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
      status: proposed
    - id: account-refreshed-today
      check: target.side != 'buy' or days_since(target.order_account.refreshed_at)
        == 0
      reason: Refresh the account today before proposing a buy.
      source:
        kind: interview
        ref: interview/log.jsonl
        quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
      status: proposed
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
    status: proposed
  refresh_position:
    actor:
    - agent
    - account_owner
    description: Read a position from Alpaca and record its shares.
    target: Position
    effects:
    - call: mcp:get_open_position
      with:
        symbol_or_asset_id: target.id
      reply: record_refresh_position
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
    status: proposed
  record_refresh_position:
    actor:
    - external:kernel
    description: Record the position Alpaca returned.
    target: Position
    params:
      ok:
        type: boolean
      qty:
        type: number
        optional: true
    preconditions:
    - id: refresh-position-done
      check: params.ok == true
      reason: Alpaca did not return the position.
    effects:
    - set:
        target.qty: params.qty
        target.refreshed_at: now()
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
    status: proposed
  refresh_account:
    actor:
    - agent
    - account_owner
    description: Read the account from Alpaca and record its value.
    target: Account
    effects:
    - call: mcp:get_account_info
      with: {}
      reply: record_refresh_account
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
    status: proposed
  record_refresh_account:
    actor:
    - external:kernel
    description: Record the account Alpaca returned.
    target: Account
    params:
      ok:
        type: boolean
      equity:
        type: number
        optional: true
    preconditions:
    - id: refresh-account-done
      check: params.ok == true
      reason: Alpaca did not return the account.
    effects:
    - set:
        target.equity: params.equity
        target.refreshed_at: now()
    source:
      kind: interview
      ref: interview/log.jsonl
      quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
    status: proposed
purpose:
  problem: 이 도메인은 계좌 주인을 위해서 에이전트랑 사람이 포트폴리오를 운영하는 문제를 해결하는 거야.
  success_metric:
    name: 총 계좌의 넷 밸류
    direction: up
  announcement: 서프라이즈 없이 계좌 주인이 이해한 대로 매매가 이루어지고 그 결과 2주 후에 계좌 잔액이 증가했다.
transitions:
  Order:
    field: status
    initial: draft
    matrix:
      draft:
        submit_proposal:
          to: proposed
          source:
            kind: interview
            ref: interview/log.jsonl
            quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
          status: proposed
        approve_order:
          deny: 초안은 먼저 제안으로 제출해야 합니다.
          source:
            kind: interview
            ref: interview/log.jsonl
            quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
          status: proposed
        decline_order:
          deny: 초안은 먼저 제안으로 제출해야 합니다.
          source:
            kind: interview
            ref: interview/log.jsonl
            quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
          status: proposed
        place_stock_order:
          deny: 초안은 먼저 제안으로 제출해야 합니다.
          source:
            kind: interview
            ref: interview/log.jsonl
            quote: 1번은 제한 2단계로 나눠줘. 2번은 오늘. 3번은 예. (4번은) 이대로 해줘.
          status: proposed
        propose_cancel:
          deny: 초안은 먼저 제안으로 제출해야 합니다.
          source:
