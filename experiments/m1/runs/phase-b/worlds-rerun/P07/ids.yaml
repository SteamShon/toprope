t-owner:
  id: owner <owner@library.invalid>
  roles: &id001
  - owner
  - approver
  kind: person
t-agent:
  id: agent <agent@library.invalid>
  kind: agent
  roles:
  - owner
  - approver
  on_behalf_of:
    id: owner <owner@library.invalid>
    roles: *id001
  grant:
    id: drafting
    actions:
    - add_source
    - ask_question
    - check_commit
    - commit_draft
    - deliver
    - fetch_source
    - next_questions
    - preview
    - propose_element
    - request_decision
    - search
