  structured:
    changes:
    - seq: 1
      findings:
      - index: 0
        finding:
          problem: The Question object is still described as 'A question in a stage's bundle, for the owner to answer.'
            After this change the expert can also ask questions, and the expert can already answer them through
            answer_question, so the description no longer matches how questions are asked and answered. The Answer
            description ('The owner's answer, in their words') has the same problem.
          where: authoring/authoring.domain.yaml, objects Question and Answer descriptions
          kind: reference
        label: false-alarm
        why: The Question/Answer descriptions are only loosely worded and the claim that they are now wrong is a
          stretch; the seeded answer is 'none' and this is not a real breakage from the permission change.
      - index: 1
        finding:
          problem: The expert now has a new ability, but nothing exercises it. No scenario covers an expert asking
            a question, and the world fixtures give no expert-asked Question. The ask_question action's source still
            cites the unrelated interview line L5 and says nothing about the expert, so the permission change has
            no confirmed backing.
          where: authoring/authoring.domain.yaml, action ask_question (source/status) and scenarios
          kind: other
        label: false-alarm
        why: Missing scenarios or a stale source citation is a coverage and documentation complaint, not an actual
          conflict or breakage caused by adding expert to the actor rule.
      edit:
        fidelity: implements
        why: Adding 'expert' to the ask_question actor list lets the expert ask questions alongside the owner, which
          is exactly what was requested.
      grader_error: null
    - seq: 2
      findings:
      - index: 0
        finding:
          problem: 'The change request says the owner sees the deadline when the decision is asked. The change only
            adds an optional free-text `deadline` field to the object and to the action params. Nothing surfaces
            it: no effect, handoff, or outbox content carries it, and no scenario or fixture exercises it. The declared
            object also says the request is ''sent to that person''s outbox'', which does not mention the deadline.
            The stated purpose, making the owner answer in time, has no behaviour behind it.'
          where: authoring.domain.yaml, request_decision action and DecisionRequest object
          kind: behaviour
        label: other-real
        why: The request says the owner sees the deadline when asked, and the edit only adds fields with nothing
          surfacing it to the owner, which is a real gap but not the seeded problem (none).
      - index: 1
        finding:
          problem: '`deadline` is typed as a plain string with no date format. Nothing checks that it is a date,
            so it cannot be compared or enforced. Nothing says what happens once it passes: `decide` is still allowed,
            the transition matrix still has only open→decided, and no invariant or precondition mentions it. A deadline
            that has no effect is only a note, and values like ''soon'' are accepted.'
          where: authoring.domain.yaml, DecisionRequest.deadline, request_decision.params.deadline, decide and the
            DecisionRequest transitions
          kind: other
        label: other-real
        why: A free-text string deadline with no format or consequence is a real weakness, though arguably beyond
          the request's scope.
      - index: 2
        finding:
          problem: 'The interface of the authoring domain has changed (a new optional param on the `request_decision`
            action and a new property), but `version: 4` is not bumped. The fixtures and the composition pin the
            interface by version, so consumers cannot tell the two declarations apart.'
          where: authoring.domain.yaml, version
          kind: other
        label: false-alarm
        why: Adding an optional field is backward compatible, and a version bump is a speculative process concern
          rather than a defect in this change.
      - index: 3
        finding:
          problem: 'The new field sits inside elements that are marked `status: confirmed` and cite an old interview
            quote about unrelated answers (''9번은 추천대로...''). The owner never confirmed the deadline, yet the elements
            still show the old confirmation and source. The record is now misleading, and the glossary and the DR1
            fixture were not updated either.'
          where: authoring.domain.yaml, DecisionRequest and request_decision source/status
          kind: reference
        label: false-alarm
        why: Source and status metadata on elements being extended is normal practice; this is not a real defect
          of the change.
      edit:
        fidelity: partial
        why: It adds an optional deadline property to the object and the action param, set when requested, but nothing
          makes the owner see it when asked.
      grader_error: null
    - seq: 3
      findings:
      - index: 0
        finding:
          problem: The wording_only flag is a free parameter on propose_element, so whoever proposes an element
            decides whether an agent may confirm it. Nothing checks that the element really only fixes wording.
            An agent can propose with wording_only true and then confirm it through confirm_wording_element. This
            bypasses the human confirmation that confirm_element requires. The precondition only reads the self-declared
            flag.
          where: 'authoring.domain.yaml: actions.propose_element.params.wording_only; actions.confirm_wording_element
            preconditions ''wording-only'''
          kind: other
        label: other-real
        why: The self-declared wording_only flag lets a proposer bypass human confirmation, which is a real weakness
          but not the seeded rule conflict itself.
      - index: 1
        finding:
          problem: Several rules still say only a person confirms an element, which the new action contradicts.
            The confirm_element description says 'Only a person confirms.' The glossary entry for element says 'confirmed
            only by a person.' The Element object description says 'proposed by an agent or confirmed by a person.'
            These were not updated.
          where: 'authoring.domain.yaml: actions.confirm_element.description; glossary.element; objects.Element.description'
          kind: contradiction
        label: seeded
        why: It identifies that the new agent-confirm action contradicts the existing rule that only a person confirms
          an element, citing the unchanged descriptions.
      - index: 2
        finding:
          problem: An agent can now confirm an element in the 'unknown' state through the new matrix cell. The glossary
            says an unknown element 'stays visible until someone answers it'. Under the previous behaviour only
            a person could move an element out of unknown. Now an agent can silently resolve an unknown by setting
            wording_only.
          where: 'authoring.domain.yaml: transitions.Element.matrix.unknown.confirm_wording_element; glossary.unknown'
          kind: behaviour
        label: other-real
        why: The new matrix cell lets an agent resolve an unknown element, which is a real side effect distinct
          from the seeded conflict.
      - index: 3
        finding:
          problem: 'The new action is a human-gated step opened to an agent. It has no ''requires: human'' and no
            source or interview citation, and its status is ''proposed''. Its effect calls the kernel''s confirm_element
            with approver: actor.id, so an agent''s id is recorded as the approver of a confirmation. The kernel
            call is also reached via an action that is not itself marked as a recorded decision. Nothing shows that
            the kernel accepts a non-person approver, or that the confirmation is recorded as agent-made.'
          where: 'authoring.domain.yaml: actions.confirm_wording_element (effects, status); transitions.Element
            confirm_wording_element cells (status: proposed)'
          kind: other
        label: seeded
        why: 'It flags that a human-gated confirmation is opened to an agent without requires: human, which is the
          same conflict with the only-a-person rule.'
      - index: 4
        finding:
          problem: The agent role is not declared anywhere. The roles are owner and expert, and world.actors lists
            only owner and expert, so 'external:agent' has no fixture. No scenario covers the new action, neither
            the allowed case (wording_only true) nor the denied cases (substance element, or wording_only unset).
            The new rule is untested, and the existing scenario a-confirmed-element-is-not-unknown-again does not
            touch it.
          where: 'authoring.domain.yaml: actions.confirm_wording_element.actor; world; scenarios'
          kind: other
        label: other-real
        why: The agent actor has no fixture and no scenario covers the new action, a real gap in the change.
      - index: 5
        finding:
          problem: The authoring interface gained a new action and a new Element/propose_element property, but the
            domain version is still 4. The composition still pins interface 1. A changed interface shipped under
            the same version can break consumers' assumptions and the change check's comparison with the previous
            commit.
          where: 'authoring.domain.yaml: version; toprope-self.composition.yaml members.authoring.interface'
          kind: other
        label: other-real
        why: The interface changed without a version bump, a plausible real problem though secondary.
      edit:
        fidelity: implements
        why: It adds an agent-permitted confirm_wording_element action with a wording-only precondition and wires
          it into the transition matrix, letting an agent confirm wording-only elements.
      grader_error: null
    - seq: 4
      findings:
      - index: 0
        finding:
          problem: The change makes Authoring send `staging`, but Delivery was not changed to know about it. Delivery's
            `Environment` object, which holds the commit an environment points at, has only an `ENV-local` fixture.
            `DeliveryRequest.environment` and `request_delivery.params.environment` are free strings, with no link
            to `Environment` and no check that the environment exists. A staging delivery is therefore accepted
            but has no declared `staging` Environment to record or track its deployed commit. The 'not a downgrade'
            floor rule needs that record. Every Delivery fixture and scenario still covers only `local`.
          where: 'delivery/delivery.domain.yaml: Environment fixtures, DeliveryRequest.environment, request_delivery;
            handoff deliver_approved_commit'
          kind: behaviour
        label: false-alarm
        why: Delivery's environment fields are free strings that already accept `staging`, and the Environment object
          has only an illustrative `ENV-local` fixture, so no real conflict or breakage exists (seeded answer is
          none).
      - index: 1
        finding:
          problem: 'The `staging` value is added to a rule marked `status: confirmed`, but its source still cites
            the old interview quote (''20번, 21번 둘 다 추천대로 동의''). That quote approved the earlier decision, so the
            new value has no recorded owner confirmation. The `deliver` precondition and the Commit transition also
            cite that quote.'
          where: 'authoring/authoring.domain.yaml: actions.deliver (params.environment enum, source/status)'
          kind: other
        label: false-alarm
        why: A stale source quote is a provenance nitpick, not a real defect, because the change request itself
          authorizes adding `staging`.
      edit:
        fidelity: implements
        why: It adds `staging` to the deliver action's environment enum alongside `local`, which is what the request
          asks for, and Delivery's free-string field accepts it.
      grader_error: null
    - seq: 5
      findings:
      - index: 0
        finding:
          problem: 'Renaming the enum value `previewed` to `built` removes a stage value that existing DeliveryRequests
            may already hold. The change has no migration for stored requests sitting at `previewed`. Once deployed
            they hold a stage that is not in the enum and has no row in the transition matrix, so `deploy` and `preview`
            on them have no defined cell. Removing an enum value is also a breaking interface change, yet the delivery
            `version` stays at 1. The composition and the Authoring handoff still pin `interface: 1` / `1.x`, so
            the change is not flagged as breaking.'
          where: delivery/delivery.domain.yaml, DeliveryRequest.stage enum and transitions.DeliveryRequest matrix;
            version; toprope-self.composition.yaml members.delivery.interface
          kind: behaviour
        label: seeded
        why: It identifies that existing requests and records stored at `previewed` break after the rename, with
          no migration.
      - index: 1
        finding:
          problem: 'The stated reason is that ''a build is ready'', but `built` is also reached when the harness
            failed. `record_build` moves to `built` whatever `harness_ok` is, and fixture R2 is `built` with `harness_ok:
            false`. Deploy is then refused by `harness-passed`. The new name reads as ready-to-deploy for a build
            that cannot be deployed, so it misleads in the case that `a-failed-harness-is-never-deployed` covers.'
          where: delivery/delivery.domain.yaml, transitions previewing.record_build -> built; world fixture R2;
            scenario a-failed-harness-is-never-deployed
          kind: other
        label: false-alarm
        why: It is a naming-preference complaint, not a real defect, since the request explicitly asked for the
          name `built` and the harness gating is unchanged.
      edit:
        fidelity: implements
        why: It renames the enum value, the transition target, the matrix row, and the fixtures from `previewed`
          to `built` consistently.
      grader_error: null
    - seq: 6
      findings:
      - index: 0
        finding:
          problem: The change says each confirmation keeps the owner's reason, but only confirm_element takes and
            stores one. confirm_all_proposed confirms every proposed element through the same kernel confirm_element
            call with no reason, and confirm_wording_element does the same for an agent. Elements confirmed either
            way end up confirmed with confirmation_reason unset, so the note is missing exactly where later readers
            would look for it. The field is optional and nothing requires it on a confirmed element, so nothing
            flags the gap.
          where: 'authoring.domain.yaml: actions confirm_all_proposed and confirm_wording_element; objects.Element.confirmation_reason'
          kind: behaviour
        label: other-real
        why: confirm_all_proposed and confirm_wording_element confirm elements without a reason, so some confirmations
