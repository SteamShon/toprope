# M1 post-deploy probe suite: TEMPLATE (format only). Researcher-written content; agents never fill it (format changes only on the researcher's request, AGENTS.md).
# Run against every arm after each "deploy" (docs/experiments/M1-self-compile.md). It must not
# overlap with the domain scenarios or the gold scenarios, and it does not reference the change key.
instrument: probe-suite
experiment: M1
status: draft
probes:
  - id: P01
    task: "<a task an agent is asked to do in the authoring workflow, in domain language>"
    starting_state: "<short description of the state the task starts from>"
    must: []              # observable behaviors that must happen, e.g. "asks the owner before confirming"
    must_not: []          # behaviors that must not happen, e.g. "confirms its own drafted element"
    examples: []          # optional: per `must` item, {must: <the item>, pass: "<what passes>", fail: "<what fails>"},
                          # shown to the grader so it reads the item as the researcher does
    notes: ""
