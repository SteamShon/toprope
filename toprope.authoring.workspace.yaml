# M1 Phase A: the Domain Authoring self domain (ADR-0022, ADR-0025, ADR-0031).
# Sources are drafted from in this order: the system (code), then records (docs), then the interview.
# `experiments/**` is never read (DEFAULT_EXCLUDE).
domain: domains/authoring/authoring.domain.yaml
interview_log: domains/authoring/interview.jsonl
usage_log: domains/authoring/sources-used.jsonl
sources:
  - id: system
    kind: repository
    path: src/toprope
    globs: ["workspace/**", "kernel/**", "adapters/cli/**", "commits/**", "check/**", "incremental/**",
            "sources/**", "decl/interface.py"]
  - id: records
    kind: records
    path: docs
    globs: ["workflow.md", "kernel-commands.md", "commits.md", "change-check.md", "world-map.md", "experiments/M1-self-domains-scope.md",
            "adr/0014-*", "adr/0017-*", "adr/0022-*", "adr/0025-*", "adr/0029-*", "adr/0032-*", "adr/0033-*", "adr/0037-*", "adr/0048-*", "experiments/M1-recheck.md"]
  - id: interview
    kind: interview-log
    path: domains/authoring/interview.jsonl
